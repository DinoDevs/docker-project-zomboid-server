version: "3.7"
services:
  web-server:
    
  game-server:
    image: dinodevs/docker-project-zomboid-server:latest
    restart: unless-stopped
    # Always have this 1-2 GB more than your PZ memory config
    mem_limit: "6g"
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"
      - "27015:27015/tcp"
    volumes:
      # Server data
      - ./data:/home/steam/Zomboid
      # Workshop mods folder
      - ./workshop-mods:/home/steam/pz-dedicated/steamapps/workshop
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
